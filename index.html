<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#75c8ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="冒険の書">
<link rel="manifest" href="./manifest.json?v=1.2">
<title>冒険の書</title>
<style>
:root{
 --sky:#8fd3ff;--grass:#8fd36b;--panel:#fffbe8;--ink:#25323a;--line:#3f4a4f;
 --blue:#2b6cb0;--yellow:#ffd84d;--red:#e94343;--green:#58bd62;--muted:#667781;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
 background:linear-gradient(#8fd3ff 0 40%,#dff4ff 40% 46%,#9fda79 46% 100%);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;min-height:100vh;padding:10px 10px 90px}
.header{position:sticky;top:0;z-index:8;background:rgba(143,211,255,.96);padding:4px 0 8px}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);
 border:3px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
h1{margin:0;font-size:20px;font-weight:1000}.ver{font-size:11px;color:var(--muted);font-weight:800}
.view{display:none}.view.active{display:block}
.card{background:linear-gradient(#fffdf2,#fff7ce);border:3px solid var(--line);border-radius:18px;
 padding:12px;margin-top:10px;box-shadow:0 5px 0 rgba(0,0,0,.16)}
.card h2{font-size:17px;margin:0 0 10px}
.tabs-wrap{display:flex;align-items:center;gap:6px;margin-top:10px}
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1;padding:2px 0 6px}
.tabs::-webkit-scrollbar,.pages::-webkit-scrollbar{display:none}
.tab-item{display:flex;gap:4px;align-items:center;flex:none}
.tab,.pill,.action{border:3px solid var(--line);background:white;border-radius:12px;padding:8px 11px;font-weight:900;
 box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tab.active{background:var(--yellow)}
.tab-reset,.add{border:3px solid var(--line);border-radius:50%;width:37px;height:37px;font-weight:1000}
.tab-reset{background:var(--red);color:white}.add{background:var(--blue);color:white;font-size:21px}
.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.action{flex:1 1 29%;background:var(--panel)}
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px}
.page{min-width:100%;scroll-snap-align:start;scroll-snap-stop:always;background:linear-gradient(#fffdf0,#fff8cf);
 border:4px solid var(--line);border-radius:22px;padding:12px}
.page-title{width:max-content;margin:0 auto 10px;background:var(--yellow);border:3px solid var(--line);
 border-radius:999px;padding:5px 14px;font-weight:1000}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.num{
 aspect-ratio:1;
 border:0;
 border-radius:50%;
 position:relative;
 display:flex;
 align-items:flex-end;
 justify-content:center;
 padding:0 0 10% 0;
 background:#fff url("./quest_icon_chest.png") center/100% 100% no-repeat;
 box-shadow:0 4px 0 rgba(0,0,0,.20);
 user-select:none;
 overflow:hidden;
}
.num::before{
 content:attr(data-num);
 position:relative;
 z-index:2;
 color:#fff;
 background:transparent;
 padding:0;
 font-size:36px;
 font-weight:1000;
 line-height:1;
 letter-spacing:-1px;
 -webkit-text-stroke:5px #111;
 paint-order:stroke fill;
 text-shadow:
   -2px -2px 0 #111, 2px -2px 0 #111,
   -2px  2px 0 #111, 2px  2px 0 #111;
}
.num::after{content:none}
.num.done{
 background:#111 !important;
 border:3px solid #111 !important;
 transform:translateY(2px);
 box-shadow:0 2px 0 rgba(0,0,0,.2);
}
.num.done::before{
 content:"✓ " attr(data-num) "\A" attr(data-date);
 white-space:pre;
 text-align:center;
 color:#fff !important;
 -webkit-text-stroke:0;
 text-shadow:none;
 line-height:1.05;
 font-size:14px;
 padding:3px 5px;
}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:white;border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kpi .label{font-size:11px;color:var(--muted);font-weight:800}.kpi .value{font-size:19px;font-weight:1000;margin-top:3px;white-space:nowrap}
.kpi.balance .value.pos{color:#0a7b2c}.kpi.balance .value.neg{color:#c92828}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=text]{width:100%;border:3px solid var(--line);border-radius:11px;padding:9px;background:white;font-weight:800}
.filebox{display:flex;gap:8px;flex-wrap:wrap}.filebox button{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px;font-weight:700}
.table-wrap{overflow:auto;border:2px solid var(--line);border-radius:12px;background:white;max-height:420px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid #d8e0e5;text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#ffe989;z-index:1}th:first-child,td:first-child{text-align:left}
.pos{color:#08782a;font-weight:900}.neg{color:#c62828;font-weight:900}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);
 display:grid;grid-template-columns:repeat(2,1fr);gap:5px;background:rgba(255,255,255,.96);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
 border-top:3px solid var(--line);z-index:12}
.navbtn{border:3px solid var(--line);border-radius:14px;background:white;padding:9px 3px;font-weight:1000}
.navbtn.active{background:#111;color:#fff;border-color:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}
.modal.show{display:flex}.modalbox{width:min(94vw,430px);background:var(--panel);border:4px solid var(--line);border-radius:19px;padding:16px}
.modalbox h3{margin:0 0 10px}.modal-actions{display:flex;gap:8px;margin-top:11px}.modal-actions button{flex:1}
.empty{text-align:center;color:var(--muted);font-weight:800;padding:20px}
.badge{display:inline-block;background:#e5f1ff;border:2px solid var(--line);border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}
@media(max-width:430px){.app{padding:8px 8px 88px}.num{font-size:16px}.grid{gap:6px}.kpi .value{font-size:18px}}

.period-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.period-header h2{margin:0}
.period-toggle{display:flex;gap:5px;flex:none}
.period-btn{
  border:3px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:7px 12px;
  font-weight:1000;
  box-shadow:0 3px 0 rgba(0,0,0,.14);
}
.period-btn.active{background:#111;color:#fff;border-color:#111}
.period-selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.period-selects.year-mode{grid-template-columns:1fr}
.compact-grid-wrap{
  width:100%;
  overflow:hidden;
}
.compact-grid{
  width:100%;
  max-width:100%;
  table-layout:fixed;
  border-collapse:separate;
  border-spacing:0;
  background:#fff;
  border:2px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  font-size:12px;
}
.compact-grid th,.compact-grid td{
  padding:7px 3px;
  border-bottom:1px solid #d8e0e5;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
}
.compact-grid th{
  position:static;
  background:#ffe989;
  font-weight:1000;
}
.compact-grid th.daycol,.compact-grid td.daycol{
  text-align:left;
  width:9%;
}
.compact-grid th:not(.daycol),.compact-grid td.amount{
  width:24.33%;
}
.compact-grid tr:last-child td{border-bottom:0}
.yearly-grid th.daycol,.yearly-grid td.daycol{width:14%}
.yearly-grid th:not(.daycol),.yearly-grid td.amount{width:36%}
.yearly-grid{font-size:13px}
.compact-grid td.amount{font-weight:900}
@media(max-width:430px){
  .period-btn{padding:7px 8px}
  .compact-grid{font-size:11px}
  .compact-grid th,.compact-grid td{padding:7px 2px;font-size:11px}
  .compact-grid td.amount{font-size:11px;letter-spacing:-0.35px}
  .card:has(#breakdownTitle){padding-left:8px;padding-right:8px}
}


/* Smartphone fixed layout for monthly/yearly results */
.compact-grid-wrap{width:100%;overflow:hidden}
.breakdown-grid{
  width:100%;
  display:grid;
  border:2px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}
.breakdown-grid.monthly{grid-template-columns:34px minmax(0,1fr) 34px minmax(0,1fr) 34px minmax(0,1fr)}
.breakdown-grid.yearly{grid-template-columns:46px minmax(0,1fr) 46px minmax(0,1fr)}
.breakdown-cell{
  min-width:0;
  padding:7px 3px;
  border-bottom:1px solid #d8e0e5;
  font-size:11px;
  line-height:1.2;
  white-space:nowrap;
}
.breakdown-cell.head{background:#ffe989;font-weight:1000}
.breakdown-cell.label{text-align:left}
.breakdown-cell.amount{text-align:center;font-weight:900;letter-spacing:-.25px}
.breakdown-grid.monthly .breakdown-cell:nth-last-child(-n+6),
.breakdown-grid.yearly .breakdown-cell:nth-last-child(-n+4){border-bottom:0}
@media(min-width:500px){
 .breakdown-grid.monthly{grid-template-columns:44px minmax(0,1fr) 44px minmax(0,1fr) 44px minmax(0,1fr)}
 .breakdown-grid.yearly{grid-template-columns:55px minmax(0,1fr) 55px minmax(0,1fr)}
 .breakdown-cell{font-size:13px;padding:8px 5px}
}


/* 収支グリッド：日付/月の位置は維持し、金額のみ各区間の中央へ */
.compact-grid td.amount,
.compact-grid th.amount,
.breakdown-grid .amount,
.monthly-grid .amount,
.yearly-grid .amount {
  text-align:center !important;
  justify-content:center !important;
  align-items:center !important;
}
.compact-grid td.daycol,
.compact-grid th.daycol,
.breakdown-grid .day,
.monthly-grid .day,
.yearly-grid .month {
  text-align:left !important;
}


/* タスク管理：完了した1〜150ボタンは黒＋白文字 */
.num.done{
  background:#111 !important;
  color:#fff !important;
  border-color:#111 !important;
}
.num.done::before{
  background:#111 !important;
  color:#fff !important;
}
.num.done::after{
  background:#fff !important;
  border-color:#fff !important;
}


/* タスク管理ページ見出し：左にタブ名、右に範囲 */
.page-heading{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:0 0 10px;
}
.page-tab-name{
  font-weight:1000;
  color:#263238;
  background:#fff;
  border:3px solid var(--line);
  border-radius:12px;
  padding:5px 10px;
  max-width:58%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.page-heading .page-title{
  margin:0;
  flex:none;
}


/* 収支サマリー：チャージ合計のみを枠いっぱいに表示 */
.summary-charge-only{
  display:block !important;
  width:100%;
}
.charge-only-kpi{
  width:100%;
  min-height:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:12px 16px !important;
}
.charge-only-kpi .label{
  font-size:20px !important;
  font-weight:1000 !important;
  color:var(--ink) !important;
  white-space:nowrap;
}
.charge-only-kpi .value{
  font-size:30px !important;
  font-weight:1000 !important;
  line-height:1 !important;
  white-space:nowrap;
  margin:0 !important;
}
@media(max-width:430px){
  .charge-only-kpi{min-height:82px;gap:10px;padding:10px 8px !important}
  .charge-only-kpi .label{font-size:18px !important}
  .charge-only-kpi .value{font-size:26px !important;letter-spacing:-0.5px}
}





/* 収支画面：チャージ合計の直下に日別/月別収支を配置 */
#financeView .card{margin-top:10px;}
#financeView .card + .card{margin-top:10px;}


/* 収支画面：カードを連続配置し、不要な余白を作らない */
#financeView{
  min-height:0 !important;
}
#financeView::after{
  content:none !important;
  display:none !important;
  min-height:0 !important;
}
#financeView > .card{
  margin-top:10px !important;
  margin-bottom:0 !important;
}
#financeView > .card + .card{
  margin-top:10px !important;
}


/* クー活入力 */
.kuu-card{
  padding:10px 14px !important;
}
.kuu-input-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-weight:1000;
  font-size:18px;
}
.kuu-input-row input{
  width:145px;
  min-width:0;
  border:3px solid var(--line);
  border-radius:12px;
  padding:8px 10px;
  text-align:center;
  background:#fff;
  font-size:20px;
  font-weight:1000;
}
.kuu-extra{
  display:none;
  width:100%;
  margin-top:8px;
  padding-top:8px;
  border-top:2px dashed #c8ced2;
}
.kuu-extra.show{display:block}
.kuu-extra-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-weight:1000;
  line-height:1.35;
}
.kuu-extra-line + .kuu-extra-line{margin-top:5px}
.kuu-extra-line .extra-label{font-size:17px}
.kuu-extra-line .extra-value{font-size:24px}
.charge-only-kpi.has-kuu{
  min-height:145px;
  flex-direction:column;
  gap:3px !important;
}
@media(max-width:430px){
  .kuu-input-row{font-size:16px}
  .kuu-input-row input{width:130px;font-size:18px}
  .kuu-extra-line .extra-label{font-size:15px}
  .kuu-extra-line .extra-value{font-size:21px}
}


100%{transform:scale(1);opacity:1}
}


.csv-three-buttons{
  display:grid !important;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}
.csv-three-buttons .action{
  width:100%;
  min-width:0;
  padding:12px 5px;
  line-height:1.25;
  white-space:normal;
}
@media(max-width:430px){
  .csv-three-buttons{gap:6px}
  .csv-three-buttons .action{font-size:14px;padding:11px 4px}
}


/* クエストページ：高速スワイプでも必ず1ページずつ */
.pages{
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:auto;
  touch-action:pan-y;
}
.page{
  scroll-snap-stop:always;
}

</style>
<link rel="apple-touch-icon" href="./icon-any.png?v=1.2">

<style id="quest-number-a-pattern">
/* 個人版 v1.3 / Aパターン：白塗り＋黒太縁 */
.quest-number,.quest-num,.questNumber,[data-quest-number]{
  position:absolute !important;
  left:50% !important;
  bottom:12% !important;
  transform:translateX(-50%) !important;
  font-size:28px !important;
  line-height:1 !important;
  font-weight:900 !important;
  color:#fff !important;
  -webkit-text-stroke:3px #000 !important;
  paint-order:stroke fill !important;
  text-shadow:none !important;
  z-index:5 !important;
  pointer-events:none !important;
}
</style>

</head>
<body>
<div class="app">
 <div class="header">
   <div class="titlebar"><div><h1>冒険の書</h1><div class="ver">個人版 v1.3</div></div><div class="badge" id="storageBadge">即時保存</div></div>
 </div>

 <section id="clearView" class="view">
   <div class="tabs-wrap"><div class="tabs" id="tabs"></div><button class="add" id="addTab">＋</button></div>
   <div class="toolbar">
     <button class="action" id="renameTab">タブ名変更</button>
     <button class="action" id="backupBtn">保存</button>
     <button class="action" id="restoreBtn">読み込み</button>
     <input id="restoreFile" type="file" accept=".json,application/json" hidden>
   </div>
   <div class="card">
     
     <div class="pages" id="pages"></div>
     <div class="note">宝箱をタップすると、その日の「月/日」を記録します。もう一度タップすると解除します。左右スワイプは、速く操作しても1ページずつ移動します。<br>最後に開いていたタブを記憶し、次回起動時も同じタブを開きます。変更内容は即時保存されます。</div>
   </div>
 </section>

 <section id="financeView" class="view active">
   <div class="card">
     <h2>CSV入力/出力</h2>
     <div class="filebox csv-three-buttons">
       <button class="action" id="csvBtn">ポイント履歴CSVを<br>複数選択</button>
       <input id="csvFile" type="file" accept=".csv,text/csv" multiple hidden>
       <button class="action" id="exportFinance">収支データ出力</button>
       <button class="action" id="clearFinance">収支データ削除</button>
     </div>
     <div class="note">月ごとに保存。同じ月を再読込した場合はその月だけ更新し、他の月のデータは維持</div>
   </div>

   <div class="card">
     <div class="period-header">
       <h2>集計期間</h2>
       <div class="period-toggle">
         <button id="monthModeBtn" class="period-btn active" type="button">月間</button>
         <button id="yearModeBtn" class="period-btn" type="button">年間</button>
         <button id="allModeBtn" class="period-btn" type="button">全期間</button>
       </div>
     </div>
     <div id="periodSelects" class="period-selects">
       <select id="yearSel"></select>
       <select id="monthSel"></select>
     </div>
     <select id="periodSel" hidden>
       <option value="month" selected>月間</option>
       <option value="year">年間</option>
       <option value="all">全期間</option>
     </select>
   </div>

   <div class="card">
     <div class="kpis summary-charge-only">
       <div class="kpi charge-only-kpi" id="chargeSummaryBox">
         <div>
           <div class="label">チャージ合計</div>
           <div class="value" id="chargeTotal">0 pt</div>
         </div>
         <div class="kuu-extra" id="kuuExtra">
           <div class="kuu-extra-line">
             <span class="extra-label">クー活合計</span>
             <span class="extra-value" id="kuuTotal">0円</span>
           </div>
           <div class="kuu-extra-line">
             <span class="extra-label">当月合計</span>
             <span class="extra-value" id="monthGrandTotal">0円</span>
           </div>
         </div>
       </div>
     </div>
   </div>

   <div class="card">
     <h2 id="breakdownTitle">日別収支</h2>
     <div id="breakdownContainer" class="compact-grid-wrap"></div>
   </div>

   <div class="card kuu-card" id="kuuCard">
     <div class="kuu-input-row">
       <span>クー活</span>
       <input id="kuuInput" type="number" inputmode="numeric" min="0" step="1" placeholder="0">
       <span>円</span>
     </div>
   </div>
 </section>
</div>

<nav class="bottomnav">
 <button class="navbtn" data-view="clearView">✓ クエスト管理</button>
 <button class="navbtn active" data-view="financeView">￥ 収支</button>
 
</nav>

<div class="modal" id="nameModal"><div class="modalbox">
 <h3 id="modalTitle">タブ名</h3><input type="text" id="tabNameInput" maxlength="30" placeholder="例：8月分">
 <div class="modal-actions"><button class="action" id="cancelName">キャンセル</button><button class="action" id="saveName">保存</button></div>
</div></div>

<script>
const APP_KEY='adventure_results_v2';
const OLD_KEYS=['clear150_tabs_v1'];
let data=loadData();

function blankData(){return {schema:2,tabs:[{id:uid(),name:'タブ1',done:{}}],active:null,finance:{rows:[],fileName:'',importedAt:'',kuukatsu:{}}}}
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function loadData(){
 let d=null;
 try{d=JSON.parse(localStorage.getItem(APP_KEY)||'null')}catch(e){}
 if(!d){
   for(const k of OLD_KEYS){
     try{
       const old=JSON.parse(localStorage.getItem(k)||'null');
       if(old&&Array.isArray(old.tabs)){d=blankData();d.tabs=old.tabs;d.active=old.active||old.tabs[0]?.id;break}
     }catch(e){}
   }
 }
 if(!d)d=blankData();
 if(!d.finance)d.finance={rows:[],fileName:'',importedAt:'',kuukatsu:{}};
 if(!d.finance.kuukatsu || typeof d.finance.kuukatsu!=='object')d.finance.kuukatsu={};
 if(!Array.isArray(d.tabs)||!d.tabs.length)d.tabs=blankData().tabs;
 d.tabs.forEach(t=>{
   if(Array.isArray(t.done)){const o={};t.done.forEach(n=>o[n]='');t.done=o}
   if(!t.done||typeof t.done!=='object')t.done={};
 });
 if(!d.active || !d.tabs.some(t=>t.id===d.active))d.active=d.tabs[0].id;
 return d;
}
function save(){localStorage.setItem(APP_KEY,JSON.stringify(data))}

function enableSinglePageSwipe(){
  const pages=document.getElementById('pages');
  if(!pages || pages.dataset.singlePageSwipe==='1') return;
  pages.dataset.singlePageSwipe='1';

  let startX=0, startY=0, startScroll=0;
  let horizontal=false;
  let active=false;

  pages.addEventListener('touchstart',e=>{
    if(!e.touches || e.touches.length!==1) return;
    active=true;
    horizontal=false;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    startScroll=pages.scrollLeft;
  },{passive:true});

  pages.addEventListener('touchmove',e=>{
    if(!active || !e.touches || e.touches.length!==1) return;
    const dx=e.touches[0].clientX-startX;
    const dy=e.touches[0].clientY-startY;

    if(!horizontal && Math.abs(dx)>10 && Math.abs(dx)>Math.abs(dy)){
      horizontal=true;
    }

    if(horizontal){
      e.preventDefault();
      pages.scrollLeft=startScroll-dx;
    }
  },{passive:false});

  pages.addEventListener('touchend',e=>{
    if(!active) return;
    active=false;

    const pageWidth=pages.clientWidth;
    if(!pageWidth) return;

    const startPage=Math.round(startScroll/pageWidth);
    let target=startPage;

    if(horizontal && e.changedTouches && e.changedTouches.length){
      const dx=e.changedTouches[0].clientX-startX;
      if(Math.abs(dx)>=35){
        target=startPage+(dx<0?1:-1);
      }
    }

    const maxPage=Math.max(0,pages.children.length-1);
    target=Math.max(0,Math.min(maxPage,target));

    pages.scrollTo({left:target*pageWidth,behavior:'smooth'});
  },{passive:true});

  pages.addEventListener('touchcancel',()=>{
    active=false;
    horizontal=false;
  },{passive:true});
}

function parseCSV(text){
 const lines=[];let row=[],cell='',q=false;
 for(let i=0;i<text.length;i++){
   const ch=text[i],nx=text[i+1];
   if(q){
     if(ch==='"'&&nx==='"'){cell+='"';i++}
     else if(ch==='"')q=false;
     else cell+=ch;
   }else{
     if(ch==='"')q=true;
     else if(ch===','){row.push(cell);cell=''}
     else if(ch==='\n'){row.push(cell);lines.push(row);row=[];cell=''}
     else if(ch!=='\r')cell+=ch;
   }
 }
 if(cell.length||row.length){row.push(cell);lines.push(row)}
 const hi=lines.findIndex(r=>r[0]?.trim()==='日付'&&r.includes('チャージポイント'));
 if(hi<0)throw new Error('対応する見出しが見つかりません');
 const headers=lines[hi].map(x=>x.trim());
 return lines.slice(hi+1).filter(r=>r.some(x=>String(x).trim()!=='')).map(r=>{
   const o={};headers.forEach((h,i)=>o[h]=r[i]??'');return {
     date:o['日付']||'',type:o['種別']||'',brand:o['ブランド名']||'',product:o['商品名']||'',
     exchange:num(o['交換ポイント']),yen:num(o['円換算額']),charge:num(o['チャージポイント'])
   }
 }).filter(r=>/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/.test(r.date));
}
function normDate(s){const m=String(s).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(!m)return null;return {y:+m[1],m:+m[2],d:+m[3],key:`${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`}}
function aggregate(rows){
 const days={},months={};
 for(const r of rows){const d=normDate(r.date);if(!d)continue;
   if(!days[d.key])days[d.key]={charge:0,exchange:0,yen:0};
   if(!months[`${d.y}-${String(d.m).padStart(2,'0')}`])months[`${d.y}-${String(d.m).padStart(2,'0')}`]={charge:0,exchange:0,yen:0};
   for(const o of [days[d.key],months[`${d.y}-${String(d.m).padStart(2,'0')}`]]){o.charge+=r.charge;o.exchange+=r.exchange;o.yen+=r.yen}
 }
 return {days,months};
}

}

function rowSignature(r){
  return JSON.stringify([
    r.date||'',r.type||'',r.brand||'',r.product||'',
    Number(r.exchange||0),Number(r.yen||0),Number(r.charge||0)
  ]);
}
// 同じ内容の行が複数ある場合も正しく扱う。
// 既存データ内の同一行の「件数」まで数え、今回CSVでそれを超えた分だけ追加する。
function mergeFinanceRows(existing,incoming){
  const existingCounts=new Map();
  existing.forEach(r=>{
    const k=rowSignature(r);
    existingCounts.set(k,(existingCounts.get(k)||0)+1);
  });
  const seenIncoming=new Map();
  const additions=[];
  incoming.forEach(r=>{
    const k=rowSignature(r);
    const seen=(seenIncoming.get(k)||0)+1;
    seenIncoming.set(k,seen);
    const already=existingCounts.get(k)||0;
    if(seen>already)additions.push(r);
  });
  return additions;
}

document.getElementById('csvFile').addEventListener('change',async e=>{
 const files=[...(e.target.files||[])];
 if(!files.length)return;

 try{
   let importedMonths=[];
   let totalRows=0;

   // 選択順に処理。同じ月が複数ある場合は後のCSVで上書き
   for(const file of files){
     const text=await file.text();
     const rows=parseCSV(text);
     if(!rows.length)continue;

     const targetMonths=[...new Set(
       rows.map(r=>{
         const d=normDate(r.date);
         return d ? `${d.y}-${String(d.m).padStart(2,'0')}` : null;
       }).filter(Boolean)
     )];

     // 今回のCSVに含まれる年月だけ既存データを削除
     data.finance.rows=data.finance.rows.filter(r=>{
       const d=normDate(r.date);
       if(!d)return true;
       const key=`${d.y}-${String(d.m).padStart(2,'0')}`;
       return !targetMonths.includes(key);
     });

     // 新しいCSV内容を追加
     data.finance.rows=data.finance.rows.concat(rows);
     totalRows+=rows.length;
     importedMonths.push(...targetMonths);
     data.finance.fileName=file.name;
   }

   if(totalRows===0)throw new Error('有効なデータがありません');

   data.finance.importedAt=new Date().toLocaleString('ja-JP');
   save();

   const badge=document.getElementById('storageBadge');
   if(badge)badge.textContent='自動保存済み';

   renderFinance();

   const uniq=[...new Set(importedMonths)];
   const label=uniq.map(k=>{
     const [y,m]=k.split('-');
     return `${y}年${Number(m)}月`;
   }).join('・');

   alert(`${files.length}個のCSVを読み込みました。
対象：${label}
他の月のデータは維持されています。`);
 }catch(err){
   alert(`CSVを読み込めませんでした。
${err.message}`);
 }

 e.target.value='';
});

document.getElementById('exportFinance').onclick=()=>{
  const rows=data.finance?.rows || [];
  if(!rows.length){
    alert('出力できる収支データがありません。');
    return;
  }
  const escapeCsv=(v)=>{
    const s=String(v ?? '');
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  };
  const header=['日付','種別','ブランド名','商品名','交換ポイント','円換算額','チャージポイント'];
  const lines=[header.join(',')];
  rows.forEach(r=>{
    lines.push([
      r.date || '', r.type || '', r.brand || '', r.product || '',
      r.exchange ?? 0, r.yen ?? 0, r.charge ?? 0
    ].map(escapeCsv).join(','));
  });
  const csv='\uFEFF'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  const stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  a.href=url;
  a.download=`収支データ_${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
